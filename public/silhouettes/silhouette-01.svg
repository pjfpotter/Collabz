<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<title>Sprout</title>
<style>
  /* --b: the body, --d: the one detail colour, --a: small marks on the detail.
     Light values first, then dark when the device prefers dark. An image can't
     read the page's CSS, so the colours travel inside the file. */
  svg { --b: #1a1f16; --d: #2a6414; --a: #f6f3ea; }
  @media (prefers-color-scheme: dark) { svg { --b: #efebdd; --d: #a8f27c; --a: #0d100c; } }
</style>
